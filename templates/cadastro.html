{% extends "base.html" %}

{% block title %}Cadastrar pedido | Dragon Ball{% endblock %}

{% block content %}
<main>
  <section>
    <h1>Cadastrar pedido</h1>
    <p>Escreva o pedido que deseja registrar.</p>

    {% if erro %}
    <p role="alert">{{ erro }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('cadastro') }}">
      <label for="pedido">Pedido</label>
      <input
        id="pedido"
        name="pedido"
        type="text"
        maxlength="255"
        required
      />
      <button type="submit">Cadastrar</button>
    </form>
  </section>
</main>
{% endblock %}
